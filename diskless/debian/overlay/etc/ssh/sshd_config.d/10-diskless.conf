# Key login for everyone, no root. Password login only for the admin user (nick), see the
# Match block (keep it last: it applies until the end of this file). Host keys are the shared
# set baked into the image.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

Match User nick
	PasswordAuthentication yes
