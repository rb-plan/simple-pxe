# Diskless FreeBSD (NFS root). Read by pxeboot / loader_pxe.efi from the NFS root.
# One file for BIOS (pxeboot: consoles comconsole/vidconsole) and UEFI (loader.efi: efi,
# comconsole); a console name a loader does not know is ignored, so list all of them.
autoboot_delay="3"
beastie_disable="YES"

# Output on the serial port (COM1/ttyS0, 115200 8N1) *and* on the screen.
console="comconsole,efi,vidconsole"
comconsole_speed="115200"
boot_multicons="YES"
boot_serial="YES"
