# Diskless FreeBSD client. Everything below is read from the in-memory /etc (see
# diskless(8), /etc/rc.initdiskless); nothing is persistent.

# Hostname: the DHCP host-name option (the loader exports it as kenv dhcp.host-name),
# else a fixed fallback.
hostname="$(/bin/kenv dhcp.host-name 2>/dev/null)"
[ -n "${hostname}" ] || hostname="freebsd-diskless"

# The NFS root interface is already configured by the kernel from the loader's DHCP
# lease; DHCP on the same interface keeps the same address and adds resolv.conf / routes.
ifconfig_DEFAULT="DHCP"

sshd_enable="YES"
dumpdev="NO"
sendmail_enable="NONE"
syslogd_flags="-ss"

# The root is read-only: nowhere to save entropy, the kernel seeds itself (RDSEED etc.).
entropy_file="NO"
entropy_boot_file="NO"

# After ramroot.sh the root is a UFS memory disk. Remount it read-write;
# nothing is written back to the server, and a reboot starts from the archive again.
root_rw_mount="YES"
