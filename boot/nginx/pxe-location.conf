# simple-pxe data tree (GRUB (http,host) needs plain HTTP, so this is included
# from both the :80 server and the https server for hub.ncosbit.net)
location = /pxe { return 301 /pxe/; }
location ^~ /pxe/downloads/ { return 403; }
location ^~ /pxe/tftp-stage/ { return 403; }
location ^~ /pxe/ {
    alias /srv/pxe-data/;
    autoindex off;
    gzip off;
    sendfile on;
    access_log /var/log/nginx/pxe_access.log;
}
