# simple-pxe diskless images (vms/pxe-images -> /srv/pxe-images). Included from the :80
# server and the https server, like pxe-location.inc. Private networks only.
#
# Only the per-OS build directories are exposed; the rest of /srv/pxe-images
# (secrets/, .work/, .cache/) is deliberately NOT under any alias and everything else below
# /images/ is a 404. The images contain the shared SSH host private keys and the console
# password hash, so they must never be reachable from outside the LAN.
location = /images { return 301 /images/; }
location ^~ /images/debian-trixie-diskless/ {
    alias /srv/pxe-images/debian-trixie-diskless/;
    autoindex on;
    gzip off;
    sendfile on;
    tcp_nopush on;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    access_log /var/log/nginx/images_access.log;
}
location ^~ /images/ { return 404; }
