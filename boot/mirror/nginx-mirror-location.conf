# simple-pxe intranet Debian mirror (vms/mirror -> /srv/mirror). Included from the :80 server
# and the https server, like pxe-location.inc. Private networks only; never a public mirror.
location ^~ /debian/ {
    alias /srv/mirror/debian/;
    autoindex on;
    gzip off;
    sendfile on;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    access_log /var/log/nginx/mirror_access.log;
}
location ^~ /debian-security/ {
    alias /srv/mirror/debian-security/;
    autoindex on;
    gzip off;
    sendfile on;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    access_log /var/log/nginx/mirror_access.log;
}
